name: 'veil-guard sign & audit'
description: 'Sign a web build with veil-guard and optionally audit a live deployment'
author: 'VeilMesh Team'

inputs:
  dist:
    description: 'Build output directory'
    required: true
    default: 'dist'
  trust-root:
    description: 'Path to trust-root.json. Must come from the repository, never from the deployment being signed.'
    required: true
  keys:
    description: 'Newline-separated private key file paths, enough to meet the trust root threshold'
    required: true

  version:
    description: 'veil-guard CLI release to install'
    required: false
    default: '0.1.1'
  token:
    description: >-
      Token used to download the CLI release. The default only works if
      veilmesh/veil-guard is public or is this same repository; otherwise supply a
      token with read access to it.
    required: false
    default: ${{ github.token }}
  bin-path:
    description: 'Use an existing veil-guard binary and skip the download entirely'
    required: false

  exclude:
    description: >-
      Newline-separated path prefixes the Service Worker leaves alone, e.g. /api/.
      Scope is an allowlist, so dynamic endpoints with no file behind them are
      refused unless carved out here.
    required: false
  csp-source:
    description: >-
      Newline-separated extra script-src sources. An inline bootstrap that injects a
      script from a third-party host cannot be inferred from the build directory.
    required: false
  navigation-html-fallback:
    description: >-
      Resolve /faq against a signed faq.html. Only for hosts that map clean URLs onto
      files — under a single-page-app fallback this compares the wrong bytes and
      blocks a healthy deployment.
    required: false
    default: 'false'
  headers-out:
    description: 'Directory for the generated Nginx / Caddy / Netlify header snippets'
    required: false
  enforce-headers:
    description: 'Emit an enforcing Integrity-Policy instead of report-only'
    required: false
    default: 'false'
  no-sri:
    description: 'Skip SRI injection and leave the built HTML untouched'
    required: false
    default: 'false'
  not-after-days:
    description: 'Manifest validity window in days (default 180). Expiry is a soft warning, never a tamper alert.'
    required: false
  source-commit:
    description: 'Recorded as a claim by the signer, not a proof. Defaults to GITHUB_SHA.'
    required: false

  emit-runtime:
    description: >-
      Write veil-guard-sw.js and veil-guard-loader.js into the output directory
      before signing, so the worker ships and is itself covered by the manifest.
    required: false
    default: 'true'
  verify:
    description: 'Re-check the signed output. Catches a later step writing after the signature.'
    required: false
    default: 'true'

  kms-key-id:
    description: >-
      KMS key for signers whose P-256 half is remote. Setting this selects a
      KMS-capable release build, which exists for linux-x64 and darwin-arm64 only.
    required: false
  kms-provider:
    description: 'aws | gcp; inferred from the key ID when omitted'
    required: false

  audit-url:
    description: 'Base URL to audit after signing'
    required: false
  audit-label:
    description: 'Vantage-point label recorded in the audit snapshot'
    required: false
    default: 'ci'
  fail-on:
    description: 'Lowest audit severity that fails the step: critical | warning | info'
    required: false
    default: 'warning'

outputs:
  manifest-sha256:
    description: 'SHA-256 of the signed veil-guard-manifest.json'

runs:
  using: 'node24'
  main: 'dist/index.js'
